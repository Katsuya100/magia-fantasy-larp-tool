name: Dungeon worldview unit tests
# Standalone targeted run is opt-in; the same tests are also part of the
# required manual CI's dungeon-regression-suites job.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node tests/test-dungeon-element-distribution.mjs
      - run: node tests/test-dungeon-enemy-element-consistency.mjs
      - run: node tests/test-dungeon-enemy-worldview.mjs
      - run: node tests/test-dungeon-enemy-flavor.mjs
      - run: node tests/test-dungeon-normal-affinity.mjs
      - run: node tests/test-dungeon-enemy-durability.mjs
