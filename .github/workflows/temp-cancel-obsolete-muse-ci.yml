name: Temporary cancel obsolete Muse CI
on:
  push:
    branches: [fix/muse-12-24-26-20261103]
permissions:
  contents: read
  actions: write
jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale CI runs on this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const {GH_TOKEN:token,GH_REPO:repo,GH_BRANCH:branch}=process.env;
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
          const base='https://api.github.com/repos/'+repo+'/actions/runs';
          const response=await fetch(base+'?branch='+encodeURIComponent(branch)+'&per_page=100',{headers});
          if(!response.ok)throw Error('listing CI runs: '+response.status+' '+await response.text());
          const data=await response.json();
          const obsolete=data.workflow_runs.filter(run=>run.name==='CI'&&run.head_branch===branch&&['queued','in_progress','waiting','pending','requested'].includes(run.status));
          let canceled=0;
          for(const run of obsolete){
            const reply=await fetch(base+'/'+run.id+'/cancel',{method:'POST',headers});
            if(![202,409].includes(reply.status))throw Error('cancel '+run.id+': '+reply.status+' '+await reply.text());
            if(reply.status===202)canceled++;
          }
          console.log('Requested cancellation of',canceled,'obsolete CI runs on',branch);
          NODE
