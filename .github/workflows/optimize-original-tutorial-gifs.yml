name: Optimize original tutorial GIFs
on:
  push:
    branches: [fix/optimize-original-tutorial-gifs-20261023]
    paths:
      - .github/workflows/optimize-original-tutorial-gifs.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize-gifs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install lossless GIF optimizer and frame validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gifsicle
          python3 -m pip install Pillow==11.3.0
      - name: Optimize the exact four original animated GIF files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/original-tutorial-gifs
          printf "filename,original_bytes,optimized_bytes\n" > .tmp/tutorial-gif-sizes.csv
          for step in outer inner spell sigil; do
            file="tutorial-${step}.gif"
            original=".tmp/original-tutorial-gifs/${file}"
            optimized="assets/images/${file}"
            git show bf31f4a97d8683b07bcaeb9c5908e579202427f7:"${optimized}" > "${original}"
            gifsicle --careful --optimize=3 "${original}" -o "${optimized}"
            old_size="$(stat -c %s "${original}")"
            new_size="$(stat -c %s "${optimized}")"
            if (( new_size >= old_size )); then
              cp "${original}" "${optimized}"
              new_size="${old_size}"
            fi
            printf '%s,%s,%s\n' "${file}" "${old_size}" "${new_size}" | tee -a .tmp/tutorial-gif-sizes.csv
          done
      - name: Verify original animation frames, pixels, and delays are unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from hashlib import sha256
          total_old=total_new=0
          for step in ('outer','inner','spell','sigil'):
              name=f'tutorial-{step}.gif'
              source=Path('.tmp/original-tutorial-gifs')/name
              dest=Path('assets/images')/name
              def frames(path):
                  with Image.open(path) as gif:
                      result=[]
                      dims=gif.size
                      loop=gif.info.get('loop',None)
                      for i in range(gif.n_frames):
                          gif.seek(i)
                          result.append((gif.info.get('duration',0),sha256(gif.convert('RGBA').tobytes()).hexdigest()))
                      return dims,loop,result
              a=frames(source); b=frames(dest)
              assert a==b,f'Changed image pixels/frames/timing: {name}'
              assert len(a[2])>=2,f'Not an animation: {name}'
              assert dest.read_bytes().startswith(b'GIF8'),name
              old,new=source.stat().st_size,dest.stat().st_size
              assert new<=old,name
              total_old+=old;total_new+=new
              print(f'VERIFIED {name}: {len(a[2])} frames, {a[0]} px, {old} -> {new} bytes')
          print(f'TOTAL: {total_old} -> {total_new} bytes; saved {total_old-total_new} bytes ({(total_old-total_new)/total_old*100:.1f}%)')
          PY
      - name: Publish compressed originals as a GitHub Actions download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: original-tutorial-gifs-optimized
          path: |
            assets/images/tutorial-outer.gif
            assets/images/tutorial-inner.gif
            assets/images/tutorial-spell.gif
            assets/images/tutorial-sigil.gif
            .tmp/tutorial-gif-sizes.csv
          compression-level: 6
      - name: Commit four optimized original GIFs to the fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/tutorial-outer.gif assets/images/tutorial-inner.gif assets/images/tutorial-spell.gif assets/images/tutorial-sigil.gif
          git commit -m "Restore original tutorial GIF animations with lossless optimization"
          git push origin HEAD:fix/optimize-original-tutorial-gifs-20261023
