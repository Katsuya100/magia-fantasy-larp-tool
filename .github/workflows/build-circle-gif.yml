name: Build sample circle GIF
on:
  push:
    branches: [main]
    paths:
      - scripts/build-dungeon-tutorial-gif.py
      - assets/images/sample.png
      - .github/workflows/build-circle-gif.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-gif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pillow
        run: python3 -m pip install Pillow==11.3.0
      - name: Animate the committed sample
        run: python3 scripts/build-dungeon-tutorial-gif.py assets/images/sample.png assets/images/dungeon-circle-tutorial.gif
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/dungeon-circle-tutorial.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate tutorial GIF from original sample [skip ci]"
          git push
