name: Image and Worker E2E (models required)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
permissions:
  contents: read
concurrency:
  group: image-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image-e2e:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: test-results/model-cache
          key: image-e2e-model-${{ runner.os }}-751bff37182d3f1213fa05d7196b954e230abad9
      - run: npm run test:e2e
