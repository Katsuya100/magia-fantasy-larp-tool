name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run simulate:dungeon-stones -- 512
      - run: npm run check
      - run: npm run build
  dungeon-fixed-deck-combat-strict:
    # The original five-spell fixed loadout owns the 256-seed win and MP target.
    # Journey win rates are diagnostic, never constrained to fixed-deck rates.
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      DUNGEON_BALANCE_STRICT: '1'
      DUNGEON_BALANCE_SAMPLES: '256'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/test-dungeon-default-balance.mjs
      - name: Archive strict fixed-deck results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-fixed-deck-combat
          path: reports/dungeon-fixed-deck-combat-v1.json
          if-no-files-found: warn

  dungeon-regression-suites:
    # Independently execute every combat regression while progression and
    # Strict 256-seed balance requires observed wins inside the interior target margin. No tests are skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: |
          failed=0
          for suite in \
            dungeon-deep-cleanse-simulation \
            dungeon-debuff-role-distribution \
            dungeon-boss-layer-audit \
            dungeon-defense-balance \
            dungeon-defense-power-balance \
            dungeon-debuff-power-balance \
            dungeon-stone-economy \
            dungeon-enemy-worldview \
            dungeon-enemy-element-consistency \
            dungeon-enemy-durability \
            dungeon-enemy-flavor \
            dungeon-normal-affinity; do
            echo "::group::$suite"
            node "tests/test-$suite.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  dungeon-journey-economy:
    # Journey economics and ink strategy are measured independently of the common combat target.
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node tests/test-dungeon-journeys.mjs
      - run: node scripts/dungeon-balance-manifest.mjs
      - run: node scripts/simulate-dungeon-journeys.mjs 16 > reports/dungeon-journeys.log
      - run: node scripts/dungeon-baseline-review-proposal.mjs
      - name: Detect unapproved economic benchmark drift
        id: economic_baseline
        continue-on-error: true # preserve diagnosis; gate explicitly at the end
        run: node scripts/check-dungeon-economy-baseline.mjs
      - run: node scripts/dungeon-extra-economy-diagnostics.mjs
      - run: node scripts/report-dungeon-journeys.mjs
      - run: node scripts/dungeon-actual-owner-combat.mjs
      - run: node scripts/dungeon-portfolio-redraw.mjs
      - run: node scripts/dungeon-ink-recovery.mjs
      - name: Check both ink strategies against identical owner states
        id: ink_pair
        continue-on-error: true # preserve full paired report; gate explicitly at the end
        run: node scripts/dungeon-ink-paired.mjs
      - name: Record independent magic ink strategy evidence
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.economic_baseline.outcome }}
          INK_OUTCOME: ${{ steps.ink_pair.outcome }}
        run: |
          echo "Unapproved old first-entry benchmark: $BASELINE_OUTCOME (diagnostic only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Formal difficulty acceptance: COMBAT_BALANCE from fixed candidate, pending approval" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_STRATEGY evidence: $INK_OUTCOME (unmet stays unmet)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive diagnostic reports and seed traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-journey-economy
          path: reports/
          if-no-files-found: warn

  dungeon-economy-combat-diagnostic:
    # The unapproved first-entry baseline remains a measured comparison ONLY.
    # It cannot block or certify the actual 256-owner, 60-case acceptance gate.
    runs-on: ubuntu-latest
    env:
      DUNGEON_BALANCE_SAMPLES: '256'
      DUNGEON_ECONOMIC_COMBAT_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/dungeon-economic-combat-benchmark.mjs
      - name: Preserve every strict economic combat measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-economic-combat-diagnostic
          path: reports/
          if-no-files-found: warn

  dungeon-foundation-256-accounts:
    # Simulator integrity and resource conservation form the design gate.
    # All balance target misses remain UNMET in reports.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node tests/test-dungeon-xp-balance.mjs
      - run: node tests/test-dungeon-journeys.mjs
      - run: node tests/test-dungeon-test-design.mjs
      - run: node scripts/dungeon-balance-manifest.mjs
      - name: Verify 256 actual banked accounts for A B C and D
        run: node scripts/dungeon-linked-256-audit.mjs
      - name: Preserve full seeded economy, source hashes and owner states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-foundation-256-accounts
          # Keep reports at ZIP root: linked job downloads into reports/.
          path: reports/
          if-no-files-found: warn
      - name: Archive matching authored replay sources separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-simulator-sources
          path: |
            assets/js/dungeon-*.mjs
            assets/data/dungeon-*.csv
            scripts/dungeon-*.mjs
            scripts/simulate-dungeon-journeys.mjs
            config/dungeon-approved-goals.v1.json
            config/dungeon-recommended-reference-candidate.v1.json
          if-no-files-found: warn

  dungeon-linked-256-combat-strict:
    # All 60 genuine journey outcomes remain archived, but their win rates
    # are not fixed-deck gates.
    needs: dungeon-foundation-256-accounts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: dungeon-foundation-256-accounts
          path: reports/
      - name: Diagnose actual-owner battles for all 60 journey conditions
        run: node scripts/dungeon-linked-256-combat.mjs
      - name: Record the original fixed-deck comparator separately
        env:
          DUNGEON_BALANCE_STRICT: '0'
          DUNGEON_BALANCE_SAMPLES: '256'
        run: node tests/test-dungeon-default-balance.mjs > reports/dungeon-fixed-deck-detail.log
      - name: Evaluate COMBAT_BALANCE, JOURNEY_READINESS, BUILD_STRENGTH, EXTRA_FARMING, RANK_ACQUISITION, BUILD_STRATEGY
        run: node scripts/dungeon-redefined-evaluation.mjs
      - name: Pair real re-farming cost to actual 256-owner combat readiness
        if: always()
        run: node scripts/dungeon-strategy-readiness.mjs
      - name: Archive separated verdicts including unmet balances and unready owners
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-linked-256-combat
          path: |
            reports/dungeon-linked-256-combat-v1.json
            reports/dungeon-strategy-readiness-v1.json
            reports/dungeon-redefined-verdicts-v1.json
            reports/dungeon-fixed-deck-combat-v1.json
          if-no-files-found: warn
      - name: Enforce real journey readiness without per-journey win-rate limits
        if: always()
        run: node scripts/check-dungeon-linked-256-combat.mjs
