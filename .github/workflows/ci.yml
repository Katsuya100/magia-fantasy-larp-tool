name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run simulate:dungeon-stones -- 512
      - run: npm run check
      - run: npm run build
  dungeon-balance-strict:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      DUNGEON_BALANCE_STRICT: '1'
      DUNGEON_BALANCE_SAMPLES: '256'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/test-dungeon-default-balance.mjs

  dungeon-regression-suites:
    # Independently execute every combat regression while progression and
    # Strict 256-seed balance requires observed wins inside the interior target margin. No tests are skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: |
          failed=0
          for suite in \
            dungeon-deep-cleanse-simulation \
            dungeon-debuff-role-distribution \
            dungeon-boss-layer-audit \
            dungeon-defense-balance \
            dungeon-defense-power-balance \
            dungeon-debuff-power-balance \
            dungeon-stone-economy \
            dungeon-enemy-worldview \
            dungeon-enemy-element-consistency \
            dungeon-enemy-durability \
            dungeon-enemy-flavor \
            dungeon-normal-affinity; do
            echo "::group::$suite"
            node "tests/test-$suite.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  dungeon-journey-economy:
    # Diagnostic modeling is not a substitute for the mandatory strict combat gate.
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node tests/test-dungeon-journeys.mjs
      - run: node scripts/dungeon-balance-manifest.mjs
      - run: node scripts/simulate-dungeon-journeys.mjs 16 > reports/dungeon-journeys.log
      - name: Detect unapproved economic benchmark drift
        id: economic_baseline
        continue-on-error: true # preserve diagnosis; gate explicitly at the end
        run: node scripts/check-dungeon-economy-baseline.mjs
      - run: node scripts/dungeon-extra-economy-diagnostics.mjs
      - run: node scripts/report-dungeon-journeys.mjs
      - run: node scripts/dungeon-portfolio-redraw.mjs
      - run: node scripts/dungeon-ink-recovery.mjs
      - name: Check both ink strategies against identical owner states
        id: ink_pair
        continue-on-error: true # preserve full paired report; gate explicitly at the end
        run: node scripts/dungeon-ink-paired.mjs
      - name: Enforce benchmark and magic ink hard gates
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.economic_baseline.outcome }}
          INK_OUTCOME: ${{ steps.ink_pair.outcome }}
        run: |
          if [ "$BASELINE_OUTCOME" != success ] || [ "$INK_OUTCOME" != success ]; then
            echo "::error::Unapproved benchmark drift or unmet magic ink strategy proof; CI remains RED"
            exit 1
          fi
      - name: Archive diagnostic reports and seed traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-journey-economy
          path: reports/
          if-no-files-found: warn

  dungeon-economy-combat-strict:
    # Fail separately for unmet game difficulty and for unfrozen/incomplete
    # preparation inventories. Nothing is force-fed from a test-only wallet.
    runs-on: ubuntu-latest
    env:
      DUNGEON_BALANCE_SAMPLES: '256'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/dungeon-economic-combat-benchmark.mjs
      - name: Preserve every strict economic combat measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon-economic-combat-strict
          path: reports/
          if-no-files-found: warn
