name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run simulate:dungeon-stones -- 512
      - run: npm run check
      - run: npm run build
  dungeon-balance-strict:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      DUNGEON_BALANCE_STRICT: '1'
      DUNGEON_BALANCE_SAMPLES: '128'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/test-dungeon-default-balance.mjs

  dungeon-tuning-probe:
    runs-on: ubuntu-latest
    env:
      PROBE_BANDS: '21,81,91'
      PROBE_HP: '0.9,0.95,1'
      PROBE_MAG: '0.68,0.72,0.76,0.8,0.84,0.88,0.92,0.96'
      PROBE_SCOPES: 'whole,last3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/dungeon-balance-probe.mjs
        env:
          PROBE_BANDS: '81,91'
          PROBE_HP: '0.85,1'
          PROBE_MAG: '0.65,0.75,0.8,0.85,0.9,0.95'
          PROBE_SCOPES: 'whole'
          PROBE_BOSS_MAG: '1,1.15,1.3'
          PROBE_BOSS_HP: '1,1.15'

  dungeon-regression-suites:
    # Independently execute every combat regression while progression and
    # 128-seed strict balance are still failing. No tests are skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: |
          failed=0
          for suite in \
            dungeon-deep-cleanse-simulation \
            dungeon-debuff-role-distribution \
            dungeon-boss-layer-audit \
            dungeon-defense-balance \
            dungeon-defense-power-balance \
            dungeon-debuff-power-balance \
            dungeon-stone-economy \
            dungeon-enemy-worldview \
            dungeon-enemy-element-consistency \
            dungeon-enemy-durability \
            dungeon-enemy-flavor \
            dungeon-normal-affinity; do
            echo "::group::$suite"
            node "tests/test-$suite.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  dungeon-progression-probe:
    # Diagnostic only: the final strict CI still uses the unmodified tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/dungeon-progression-tuning-probe.mjs
