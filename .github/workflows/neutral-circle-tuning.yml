name: Neutral circle HP tuning (temporary)
on:
  push:
    branches:
      - balance/neutral-circle-strict-targets
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      TUNE_SAMPLES: '32'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/tune-dungeon-neutral.mjs
