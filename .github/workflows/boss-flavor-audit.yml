name: Boss flavor audit
on:
  push:
    branches: [fix/dungeon-boss-flavor-balance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boss-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node tests/test-dungeon-boss-layer-audit.mjs
